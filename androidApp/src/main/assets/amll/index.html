<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="bundle.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #bg { position: fixed; inset: 0; z-index: 0; }
  #bg canvas { width: 100% !important; height: 100% !important; display: block; }
  #bg-veil {
    position: fixed; inset: 0; z-index: 1;
    background: rgba(0, 0, 0, 0.45);
    pointer-events: none;
  }
  #lyrics {
    position: fixed; inset: 0; z-index: 2;
  }
  #lyrics .amll-lyric-player {
    width: 100%;
    height: 100%;
    --amll-lp-font-size: 34px;
    --amll-lp-padding-top: 42%;
    --amll-lp-padding-bottom: 48%;
  }
  #hint {
    position: fixed; inset: 0; z-index: 3;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255, 255, 255, 0.55);
    font: 16px/1.5 -apple-system, "Noto Sans CJK SC", sans-serif;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="bg"></div>
  <div id="bg-veil"></div>
  <div id="lyrics"></div>
  <div id="hint">暂无歌词</div>
  <script src="bundle.js"></script>
  <script src="page.js"></script>
</body>
</html>
